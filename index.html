<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Грибной лес</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#e9e6f7;--mute:#9b97bd;--card:#14173af0;--line:#2c3068;--btn:#f3d27a;--btnt:#2a1f05}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:#0b0f2e;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 14px 14px;box-sizing:border-box}
#stage{flex:1;min-height:0;width:min(100%,460px);transform-origin:50% 92%}
.pop{animation:pop .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card{width:min(100%,460px);background:var(--card);border:2px solid var(--tc,var(--line));border-radius:18px;padding:14px 16px;box-sizing:border-box}
.row{display:flex;justify-content:space-between;align-items:baseline}
#id{font-size:22px;font-weight:700;letter-spacing:.04em}
#tier{color:var(--tc);font-weight:700}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.btns,.open{display:flex;gap:10px;margin-top:12px}
.open{margin-top:8px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:#262a63;color:var(--ink)}
#go{flex:1;background:var(--btn);color:var(--btnt);font-weight:700}
input{flex:1;min-width:0;font:inherit;background:#0e1130;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
dialog{background:#14173a;color:var(--ink);border:2px solid var(--tc,var(--line));border-radius:18px;padding:16px;width:min(92vw,420px);max-height:85vh;overflow:auto}
dialog::backdrop{background:#05061ab3}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
td:nth-child(1){color:var(--mute)}td:nth-child(3){text-align:right;font-weight:700}td:nth-child(4){text-align:right;color:var(--mute);font-size:12px;padding-left:8px}
#badge{font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--tc);text-shadow:0 0 14px var(--tc);padding:4px 0}
#add[disabled]{opacity:.6;cursor:default}
.btns button{flex:1}
summary{cursor:pointer;color:var(--mute);margin-top:10px;font-size:14px}
.op{background:none;color:var(--ink);padding:0;width:100%;font-size:13px}
.del{width:100%;margin-top:6px;padding:6px;font-size:12px;background:#3a1d3f;color:var(--ink)}
.three{gap:8px}.three button{padding:12px 4px;font-size:14px}
#ttb td{color:var(--ink)}#ttb td:nth-child(2),#ttb td:nth-child(3){text-align:right;font-weight:400}#ttb td:nth-child(3){color:var(--mute);font-size:12px}
#grid,#og{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.lk{background:none;color:var(--ink);padding:0;font:inherit;text-decoration:underline;cursor:pointer}
.kr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.kr button{padding:8px 10px;font-size:13px}
h4{margin:14px 0 4px;font-size:14px;color:var(--mute)}
.sell{width:100%;margin-top:6px;padding:6px;font-size:12px;background:#4b3b12;color:var(--ink)}
#abody input{display:block;width:100%;box-sizing:border-box;margin:6px 0}#abody button{width:100%;margin-bottom:4px}
.it{background:#0e1130;border:2px solid var(--c);border-radius:12px;padding:6px;text-align:center;font-size:13px}
.it svg{width:100%;height:auto;display:block}
.it b{color:var(--c)}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style></head><body>
<svg id="bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
<main><div id="badge"></div><svg id="stage" viewBox="0 0 300 320" role="img" aria-label="Гриб"></svg>
<div class="card" id="card">
<div class="row"><span id="id"></span><span id="tier"></span></div>
<div class="sub" id="pts"></div>
<div class="sub" id="res"></div><div class="btns"><button id="go">Найти гриб</button></div><div class="btns three" style="margin-top:8px"><button id="add">В коллекцию</button><button id="sellc">Продать</button></div><div class="btns three" style="margin-top:8px"><button id="info">Состав</button><button id="cbtn">Коллекция</button><button id="upg">Прокачка</button></div><details id="more"><summary>Ещё</summary><div class="btns three"><button id="vid">Поиск по ID</button><button id="tbl">Таблица</button><button id="lb">Рейтинг</button></div><div class="btns three" style="margin-top:8px"><button id="acc">Аккаунт</button></div></details>

<div class="sub" id="cnt" style="margin-top:8px"></div>
</div></main>
<dialog id="dlg"><div class="row"><b id="dt"></b><button id="cls">Закрыть</button></div><table id="tb"></table></dialog>
<dialog id="cdlg"><div class="row"><b id="ct"></b><button id="ccl">Закрыть</button></div><div class="sub" id="cs"></div><button id="srt" style="margin-top:8px"></button><div id="grid"></div></dialog>
<dialog id="vdlg"><div class="row"><b>Поиск по ID</b><button id="vcl">Закрыть</button></div><div class="open"><input id="vin" placeholder="ID: до 8 символов 0-9, A-F" maxlength="10" autocomplete="off"><button id="vgo">Открыть</button></div><div class="sub" id="vmsg">Гриб можно только посмотреть, в коллекцию он не добавляется.</div><div id="vres"></div></dialog>
<dialog id="tdlg"><div class="row"><b>Таблица элементов</b><button id="tcl">Закрыть</button></div><div class="sub">Вариант, очки редкости и шанс выпадения внутри своего элемента.</div><table id="ttb"></table></dialog>
<dialog id="ndlg"><b>Выбери ник</b><div class="sub">Он будет виден в мировом рейтинге.</div><div class="open"><input id="nin" maxlength="16" placeholder="Ник" autocomplete="off"><button id="ngo">Играть</button></div><div class="sub" id="nmsg"></div><button id="nacc" style="margin-top:10px;width:100%">У меня есть аккаунт</button></dialog>
<dialog id="ldlg"><div class="row"><b>Мировой рейтинг</b><button id="lcl">Закрыть</button></div><div class="sub" id="lme"></div><table id="ltb"></table></dialog>
<dialog id="odlg"><div class="row"><b id="ot"></b><button id="ocl">Закрыть</button></div><div class="sub" id="os"></div><div id="og"></div></dialog>
<dialog id="udlg"><div class="row"><b>Прокачка поиска</b><button id="ucl">Закрыть</button></div><div class="sub" id="ures"></div><div id="ubody"></div></dialog>
<dialog id="adlg"><div class="row"><b>Аккаунт</b><button id="acl">Закрыть</button></div><div class="sub" id="amsg"></div><div id="abody"></div></dialog>
<script>
const $=s=>document.getElementById(s);
const m32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const SLOTS=[
['Форма шляпки',[['купол',0],['плоская',1],['конус',2],['колокол',4],['воронка',7],['многоярусная',12],['спиральная',20]]],
['Окраска шляпки',[['однотонная',0],['двухцветная',6],['перламутровая',15]]],
['Узор',[['гладкая',0],['крапинки',2],['пятна',3],['полосы',5],['кольца',8],['сетка',12],['звёзды',18]]],
['Текстура',[['матовая',0],['бархатная',2],['чешуйчатая',4],['глянцевая',6],['кристаллическая',14]]],
['Ножка',[['прямая',0],['толстая',1],['изогнутая',3],['узловатая',5],['двойная',10]]],
['Юбочка',[['нет',0],['простое',2],['кружевное',6],['двойное',9],['светящееся',15]]],
['Пластинки',[['редкие',0],['частые',1],['радиальные',4],['цветные',9]]],
['Основание',[['обычное',0],['корни',2],['мох',3],['клубень',5],['ореол спор',10]]],
['Свечение',[['нет',0],['слабое',10],['пятнами',18],['пульсирующее',28],['радужное',40]]],
['Частицы',[['нет',0],['споры',4],['пыльца',6],['светлячки',12],['искры',18]]],
['Аномалия',[['нет',0],['прозрачность',25],['второй гриб',35],['кристаллы',40],['тень',50]]]];
const TIERS=[[0,'обычный','#9aa3b5'],[37,'необычный','#6fcf8a'],[47,'редкий','#5aa2ff'],[55,'очень редкий','#35d6d0'],[63,'эпический','#b57bff'],[70,'легендарный','#ffc94d'],[77,'мифический','#ff7a5c'],[85,'уникальный','#ff5fd0'],[95,'реликтовый','#c7a46b'],[105,'древний','#8bbf5a'],[115,'артефактный','#4fc3c9'],[125,'сакральный','#f6efd2'],[135,'божественный','#ffe066'],[145,'астральный','#8f8cff'],[155,'космический','#3d6bff'],[165,'трансцендентный','#ff4fd8']];
[[2,'тематический'],[3,'тематическая'],[5,'тематическая'],[8,'тематическое'],[9,'тематические'],[10,'тематическая']].forEach(([k,n])=>SLOTS[k][1].push([n,0]));
const THS=[2,3,5,8,9,10],Q=0.08828,TW=[0.28202,0.21162,0.15413,0.11452,0.08533,0.06328,0.04726,0.04185],THQ=3;
SLOTS.forEach(([n,v],k)=>{const th=THS.includes(k),w=(th?v.slice(0,-1):v).map(x=>(1+x[1])**-1.5);if(th)w.push(w.reduce((a,c)=>a+c,0)*Q/(1-Q));const m=Math.max(...w);v.forEach((x,i)=>{x[2]=w[i];x[1]=Math.round(3*Math.log2(m/w[i]))})});
const W=v=>v.map(x=>x[2]);
function pick(seed){const r=m32(seed);return SLOTS.map(([n,v])=>{const w=W(v);let t=r()*w.reduce((a,b)=>a+b);for(let i=0;i<w.length;i++){t-=w[i];if(t<=0)return i}return 0})}
const act=ix=>[1,ix[2]>0,1,ix[5]>0,1,ix[8]>0,ix[9]>0];
const HN=['Монохром','Аналоговая','Комплементарная','Триада'],HPR={3:[0.02152,0.08465,0.03327,0.02233],4:[0.002403,0.018918,0.008944,0.015357],5:[0.00026,0.004006,0.002039,0.006855]},HPT={3:[17,11,15,16],4:[26,17,20,18],5:[36,24,27,22]};
const dh=(a,b)=>{const d=Math.abs(a-b)%360;return Math.min(d,360-d)};
function hmask(hs){let m=0;const n=hs.length,s=[...hs].sort((a,b)=>a-b);let g=s[0]+360-s[n-1];for(let i=0;i<n-1;i++)g=Math.max(g,s[i+1]-s[i]);const sp=360-g;
if(sp<=30)m|=1;if(sp<=60)m|=2;
for(const a of hs){let f=0,ok=true;for(const c of hs){if(dh(c,a)>15){if(dh(c,(a+180)%360)<=15)f++;else{ok=false;break}}}if(ok&&f>0){m|=4;break}}
for(const a of hs){const z=[0,0,0];let ok=true;for(const c of hs){if(dh(c,a)<=15)z[0]++;else if(dh(c,(a+120)%360)<=15)z[1]++;else if(dh(c,(a+240)%360)<=15)z[2]++;else{ok=false;break}}if(ok&&z[0]&&z[1]&&z[2]){m|=8;break}}
return m}
function harm(ix,s){const C=colors(s),a=act(ix),hs=[0,1,2,3,4].filter(k=>a[k]).map(k=>C[k].h),n=hs.length,m=hmask(hs);let b=null;for(let i=0;i<4;i++)if((m&(1<<i))&&(!b||HPT[n][i]>b.p))b={i,n,p:HPT[n][i]};return b}
function themes(seed,ix){const r=m32(seed^0x71a3c5);return ix.map((v,k)=>{if(!THS.includes(k)||v!==SLOTS[k][1].length-1)return -1;let t=r(),i=0;for(;i<7;i++){if(t<TW[i])break;t-=TW[i]}return i})}
function themeTier(ix,s){const c=[0,0,0,0,0,0,0,0];themes(s,ix).forEach(t=>{if(t>=0)c[t]++});for(let t=7;t>=0;t--)if(c[t]>=THQ)return t;return -1}
const raw=(ix,s)=>{const h=harm(ix,s);return ix.reduce((a,i,k)=>a+SLOTS[k][1][i][1],0)+(h?h.p:0)};
const total=(ix,s)=>{const t=themeTier(ix,s);return t>=0?TIERS[8+t][0]:Math.min(raw(ix,s),TIERS[8][0]-1)};
const tierOf=p=>TIERS.filter(t=>p>=t[0]).pop();

/* background */
(function(){const r=m32(7),a=(x,y)=>x+r()*(y-x);let s=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0d2b"/><stop offset=".55" stop-color="#2b2559"/><stop offset="1" stop-color="#6a4377"/></linearGradient></defs><rect width="800" height="600" fill="url(#sk)"/>`;
for(let i=0;i<45;i++)s+=`<circle cx="${a(0,800)}" cy="${a(0,300)}" r="${a(.6,1.6)}" fill="#fff" opacity="${a(.3,.9)}"/>`;
s+=`<circle cx="620" cy="110" r="72" fill="#f1ecd0" opacity=".1"/><circle cx="620" cy="110" r="38" fill="#f1ecd0"/>`;
const pine=(x,y,h,c)=>`<polygon points="${x},${y-h} ${x+h*.3},${y-h*.4} ${x+h*.14},${y-h*.4} ${x+h*.38},${y} ${x-h*.38},${y} ${x-h*.14},${y-h*.4} ${x-h*.3},${y-h*.4}" fill="${c}"/>`;
for(let i=0;i<18;i++)s+=pine(a(-20,820),470,a(120,190),'#1d2050');
for(let i=0;i<13;i++)s+=pine(a(-20,820),530,a(150,240),'#14173d');
s+=`<rect y="500" width="800" height="100" fill="#101336"/>`;
for(let i=0;i<8;i++)s+=pine(i%2?a(630,830):a(-30,170),620,a(260,380),'#0b0e29');
$('bg').innerHTML=s})();

/* mushroom */
const dome=(W,H,y,c=150)=>`M${c-W},${y}C${c-W},${y-H*1.33} ${c+W},${y-H*1.33} ${c+W},${y}Q${c},${y+14} ${c-W},${y}Z`;
const cy=170;
const CAPS=[[dome(85,70,cy),85,cy-70],[dome(100,36,cy),100,cy-36],[`M80,${cy}Q125,${cy-95} 150,${cy-105}Q175,${cy-95} 220,${cy}Q150,${cy+12} 80,${cy}Z`,70,cy-105],[dome(72,88,cy),72,cy-88],[`M52,${cy-55}Q70,${cy+8} 150,${cy+8}Q230,${cy+8} 248,${cy-55}Q150,${cy-30} 52,${cy-55}Z`,98,cy-55],[dome(85,55,cy)+dome(55,42,cy-42),85,cy-97],[`M70,${cy}Q70,${cy-70} 140,${cy-100}Q200,${cy-120} 190,${cy-70}Q180,${cy-50} 205,${cy-45}Q225,${cy-30} 230,${cy}Q150,${cy+12} 70,${cy}Z`,80,cy-110]];
const PAL=[['#6b4228','#8f5d3a','#b7835a'],['#bdb4a2','#e6dfd0','#fbf7ee'],['#7a1620','#c2303a','#ee6a5f'],['#b88a14','#efbe2a','#ffe27a'],['#1d3f8f','#3a74d8','#8fb9ff'],['#4b2288','#8450cf','#c39bff'],['#9fb4c8','#d9c8e8','#effff8'],['#d63a8e','#ff8a3d','#ffd25e']];
const CN=['шляпка','узор','ножка','юбочка','пластинки','свечение','частицы'],SAT=[25,45,65,85],LIG=[30,42,54,66];
function colors(seed){const r=m32(seed^0x7f4a7c15);return CN.map((n,k)=>{const h=Math.floor(r()*360),si=Math.floor(r()*4),li=Math.floor(r()*4);return{h,s:SAT[si],l:LIG[li]}})}
const hh=(c,d,dl=0,ds=0)=>`hsl(${(c.h+d+360)%360},${Math.min(100,c.s+ds)}%,${Math.max(5,Math.min(95,c.l+dl))}%)`;
const hex=c=>{const l=c.l/100,a=c.s/100*Math.min(l,1-l),f=n=>{const k=(n+c.h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return('#'+f(0)+f(8)+f(4)).toUpperCase()};
const colRows0=(ix,s)=>{const a=act(ix),h=harm(ix,s);return colors(s).map((c,k)=>a[k]?`<tr><td>Цвет: ${CN[k]}</td><td><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${hh(c,0)};vertical-align:-1px"></span> ${hex(c)}</td><td></td><td></td></tr>`:'').join('')+(h?`<tr><td>Гармония</td><td>${HN[h.i]}</td><td>+${h.p}</td><td>${(HPR[h.n][h.i]*100).toFixed(2)}%</td></tr>`:'')};
const themeRows=(ix,s)=>{const t=themeTier(ix,s),r=raw(ix,s);if(t>=0)return `<tr><td>Тема</td><td>${TV[t].n} ×${themes(s,ix).filter(x=>x===t).length}</td><td>=${TIERS[8+t][0]}</td><td></td></tr>`;return r>TIERS[8][0]-1?`<tr><td>Предел без темы</td><td></td><td>${TIERS[8][0]-1}</td><td></td></tr>`:''};
const colRows=(ix,s)=>colRows0(ix,s)+themeRows(ix,s);
const rs=()=>crypto.getRandomValues(new Uint32Array(1))[0];
const idf=s=>'№ '+s.toString(16).toUpperCase().padStart(8,'0');

const star=(x,y,r)=>`${x},${y-r} ${x+r*.3},${y-r*.3} ${x+r},${y} ${x+r*.3},${y+r*.3} ${x},${y+r} ${x-r*.3},${y+r*.3} ${x-r},${y} ${x-r*.3},${y-r*.3}`;
const stem=(cx,w,b)=>{const L=cx-w/2,R=cx+w/2;return `<path d="M${L},${cy}C${L+b},${cy+45} ${L-b},${cy+90} ${L-8},282L${R+8},282C${R-b},${cy+90} ${R+b},${cy+45} ${R},${cy}Z" fill="url(#sg)"/>`};


/* темы верхних ступеней */
const TV=[
{n:'Реликтовый',c:['#c7a46b','#7a5a35','#efe0b8'],g:'M-1,0A1,1 0 1,1 1,0M-.3,-.3L.3,.3',f:0,x:'crack',t:'M-1,.8L-.4,-.9L.2,-.2L.9,-1L.6,.8Z',tf:1},
{n:'Древний',c:['#8bbf5a','#3f6b2d','#d9f0b0'],g:'M0,-1V1M-.7,-.5L0,0L.7,-.5M-.5,.4L0,.8L.5,.4',f:0,x:'moss',t:'M0,1V-.1M0,.1C-1,0-1,-.9-.1,-1M0,.3C1,.2 1,-.6 .1,-.8',tf:0},
{n:'Артефактный',c:['#4fc3c9','#cfd8e0','#27505c'],g:'M0,-1L.8,-.2L0,1L-.8,-.2Z',f:1,x:'hatch',t:'M-1,.6L-.9,-.6L-.4,0L0,-.9L.4,0L.9,-.6L1,.6Z',tf:1},
{n:'Сакральный',c:['#f6efd2','#d9b95a','#ffffff'],g:'M-1,0A1,1 0 1,0 1,0A1,1 0 1,0 -1,0M0,-1V1M-1,0H1',f:0,x:'rings',t:'M0,-1L.9,.7L-.9,.7Z',tf:0},
{n:'Божественный',c:['#ffe066','#ffb300','#fffbe0'],g:'M0,-1V-.5M0,1V.5M-1,0H-.5M1,0H.5M-.7,-.7L-.35,-.35M.7,-.7L.35,-.35M-.7,.7L-.35,.35M.7,.7L.35,.35',f:0,x:'rays',t:'M-1,0A1,.3 0 1,0 1,0A1,.3 0 1,0 -1,0',tf:0},
{n:'Астральный',c:['#8f8cff','#4de3ff','#d8d6ff'],g:'M-1,.6L-.3,-.5L.4,.2L1,-.7',f:0,x:'const',t:'M.5,-1A1,1 0 1,0 .5,1A.75,.75 0 1,1 .5,-1Z',tf:1},

{n:'Трансцендентный',c:['#ff4fd8','#4fffd0','#ffe94f'],g:'M0,-1L.9,.7L-.9,.7ZM0,-.5L.45,.35L-.45,.35Z',f:0,x:'iri',t:'M0,0C.4,-.8 1,-.8 1,0C1,.8 .4,.8 0,0C-.4,-.8 -1,-.8 -1,0C-1,.8 -.4,.8 0,0Z',tf:0}];
